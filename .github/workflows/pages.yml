# Build the interactive tutorial, and publish it to GitHub Pages.
#
# A pull request is built and checked but not published, so a change that
# would break the site shows up before it is merged. Pushes to main publish.
#
# One-off set-up: in the repository's Settings > Pages, set the source to
# "GitHub Actions".
name: Build and publish the tutorial site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "R/**"
      - "python/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "R/**"
      - "python/**"
      - ".github/workflows/pages.yml"
  # Lets the site be republished by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a newer push waits rather than cancelling a
# deployment part-way through. Pull requests build in a group of their own,
# where a new commit does replace the build still running for the last one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # The R script and the notebook are generated from the same steps the
      # site shows. Fail here rather than publish a site that disagrees with
      # the files students run.
      - name: Check the R script and notebook match the site
        run: npm run examples -- --check

      - run: npm run check

      - name: Build
        run: npm run build
        env:
          # A project site is served from /<repository>/, not from the root.
          BASE_PATH: /${{ github.event.repository.name }}

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
